# ============================================================================
#  Queries — Kanak Parakh Foundation
#  Every operation MUST carry an @auth directive; without one it defaults to
#  NO_ACCESS and is unreachable from the client.
# ============================================================================

# --- Dashboard -------------------------------------------------------------

# The four stat cards. Counts and sums happen in Postgres, not the browser.
query DashboardStats @auth(level: USER) {
  totalParticipants: participants_aggregate {
    count
  }
  activeParticipants: participants_aggregate(where: { status: { eq: ACTIVE } }) {
    count
  }
  hoursCommitted: hoursLogs_aggregate {
    hours_sum: hours { sum }
  }
  expertiseAreas: expertiseAreas_aggregate {
    count
  }
}

# The "Our People" table on the dashboard — most recent joiners first.
query RecentParticipants($limit: Int = 5) @auth(level: USER) {
  participants(orderBy: { joinedOn: DESC }, limit: $limit) {
    id
    fullName
    email
    phone
    avatarUrl
    status
    availabilityHoursPerWeek
    expertise: participantExpertise_on_participant {
      expertise { id name colorToken }
    }
  }
}

# --- People Directory ------------------------------------------------------

# One query backs the whole Search & Filter screen. Every argument is
# optional; passing null means "don't filter on this".
query SearchParticipants(
  $search: String
  $status: ParticipantStatus
  $location: String
  $minHours: Int
  $limit: Int = 50
  $offset: Int = 0
) @auth(level: USER) {
  participants(
    where: {
      _and: [
        { status: { eq: $status } }
        { location: { eq: $location } }
        { availabilityHoursPerWeek: { ge: $minHours } }
        {
          _or: [
            { fullName: { contains: $search } }
            { email: { contains: $search } }
          ]
        }
      ]
    }
    orderBy: { fullName: ASC }
    limit: $limit
    offset: $offset
  ) {
    id
    fullName
    email
    phone
    location
    avatarUrl
    status
    availabilityHoursPerWeek
    joinedOn
    expertise: participantExpertise_on_participant {
      expertise { id name colorToken }
    }
  }
}

# Filtering by skill goes through the join table, which is the one thing a
# document database makes genuinely awkward.
query ParticipantsByExpertise($expertiseId: UUID!) @auth(level: USER) {
  participantExpertises(where: { expertiseId: { eq: $expertiseId } }) {
    participant {
      id
      fullName
      email
      phone
      avatarUrl
      status
      availabilityHoursPerWeek
    }
  }
}

# --- Single participant ----------------------------------------------------

query GetParticipant($id: UUID!) @auth(level: USER) {
  participant(id: $id) {
    id
    fullName
    email
    phone
    location
    avatarUrl
    about
    role
    status
    availabilityHoursPerWeek
    consentToContact
    joinedOn
    expertise: participantExpertise_on_participant {
      expertise { id name colorToken }
    }
    projects: projectMembers_on_participant {
      roleOnProject
      project { id name status }
    }
  }
}

# "My Profile" — resolves the signed-in user without the client passing an id,
# so one user can never request another user's record through this operation.
query GetMyProfile @auth(level: USER) {
  participants(where: { authUid: { eq_expr: "auth.uid" } }, limit: 1) {
    id
    fullName
    email
    phone
    location
    avatarUrl
    about
    role
    status
    availabilityHoursPerWeek
    joinedOn
    expertise: participantExpertise_on_participant {
      expertise { id name colorToken }
    }
  }
}

# --- Supporting lists ------------------------------------------------------

query ListExpertiseAreas @auth(level: USER) {
  expertiseAreas(orderBy: { name: ASC }) {
    id
    name
    colorToken
  }
}

query ListProjects @auth(level: USER) {
  projects(orderBy: { createdAt: DESC }) {
    id
    name
    description
    status
    startsOn
    endsOn
    lead { id fullName avatarUrl }
    members: projectMembers_on_project { participant { id fullName avatarUrl } }
  }
}

query ListResources($category: String) @auth(level: USER) {
  resources(
    where: { category: { eq: $category } }
    orderBy: { createdAt: DESC }
  ) {
    id
    title
    description
    url
    category
    createdAt
    uploadedBy { id fullName }
  }
}

query MyNotifications @auth(level: USER) {
  notifications(
    where: { recipient: { authUid: { eq_expr: "auth.uid" } } }
    orderBy: { createdAt: DESC }
    limit: 20
  ) {
    id
    title
    body
    linkTo
    readAt
    createdAt
  }
}
