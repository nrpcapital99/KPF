# ============================================================================
#  Kanak Parakh Foundation — Data Connect schema (PostgreSQL / Cloud SQL)
# ============================================================================
#  Every type below becomes a real Postgres table. Relationships are declared
#  by referencing another @table type, which generates a real foreign key.
# ============================================================================

enum MemberRole {
  PARTICIPANT
  COORDINATOR
  ADMIN
}

enum ParticipantStatus {
  ACTIVE
  INACTIVE
  PENDING
  ARCHIVED
}

enum ProjectStatus {
  PLANNING
  ACTIVE
  COMPLETED
  ON_HOLD
}

# ---------------------------------------------------------------------------
#  Participant — the core record behind the People Directory
# ---------------------------------------------------------------------------
type Participant @table(name: "participants", key: "id") {
  id: UUID! @default(expr: "uuidV4()")

  # Set when the person has a Firebase Auth login of their own. Null for
  # people an admin added to the directory who have never signed in.
  authUid: String @unique

  fullName: String!
  email: String! @unique
  phone: String!
  location: String
  avatarUrl: String
  about: String

  role: MemberRole! @default(value: PARTICIPANT)
  status: ParticipantStatus! @default(value: PENDING)

  # Drives the "Availability" column and the 10 hrs/week filter
  availabilityHoursPerWeek: Int!

  # "I agree to be contacted by Kanak Parakh Foundation"
  consentToContact: Boolean! @default(value: false)

  joinedOn: Date! @default(expr: "request.time")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ---------------------------------------------------------------------------
#  Expertise — a controlled vocabulary, not free text on the participant.
#  This is what makes "Active Expertise Areas: 8" a real count and the
#  expertise filter a real query instead of a string match.
# ---------------------------------------------------------------------------
type ExpertiseArea @table(name: "expertise_areas", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  description: String
  # Which pill colour the UI paints this tag: blue | mint | lavender | amber
  colorToken: String @default(value: "blue")
  createdAt: Timestamp! @default(expr: "request.time")
}

# Many-to-many join: one person has many skills, one skill has many people.
type ParticipantExpertise
  @table(name: "participant_expertise", key: ["participant", "expertise"]) {
  participant: Participant!
  expertise: ExpertiseArea!
  addedAt: Timestamp! @default(expr: "request.time")
}

# ---------------------------------------------------------------------------
#  Projects / Teams
# ---------------------------------------------------------------------------
type Project @table(name: "projects", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  description: String
  status: ProjectStatus! @default(value: PLANNING)
  startsOn: Date
  endsOn: Date
  lead: Participant
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ProjectMember
  @table(name: "project_members", key: ["project", "participant"]) {
  project: Project!
  participant: Participant!
  roleOnProject: String
  joinedAt: Timestamp! @default(expr: "request.time")
}

# ---------------------------------------------------------------------------
#  Hours — what actually gets counted, as opposed to what was pledged.
#  "Total Hours Committed: 620 hrs" on the dashboard sums this table.
# ---------------------------------------------------------------------------
type HoursLog @table(name: "hours_logs", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  participant: Participant!
  project: Project
  hours: Float!
  workedOn: Date!
  note: String
  verifiedBy: Participant
  verifiedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

# ---------------------------------------------------------------------------
#  Resources — the shared library in the sidebar
# ---------------------------------------------------------------------------
type Resource @table(name: "resources", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  description: String
  url: String!
  category: String
  uploadedBy: Participant
  createdAt: Timestamp! @default(expr: "request.time")
}

# ---------------------------------------------------------------------------
#  Notifications — the bell in the top bar
# ---------------------------------------------------------------------------
type Notification @table(name: "notifications", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  recipient: Participant!
  title: String!
  body: String
  linkTo: String
  readAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}
