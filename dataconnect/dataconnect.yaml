      database: "kpf"
      cloudSql:
        # Replace with your Cloud SQL instance id after running:
        #   firebase init dataconnect
        instanceId: "kpf-directory-instance"
      schemaValidation: "COMPATIBLE"

connectorDirs: ["./connector"]
